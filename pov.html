<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハンド動き解説（目線）</title>
<link rel="stylesheet" href="css/style.css?v=202609201201">
</head>
<body>
<header class="top">
  <a class="back" href="./">◀ 一覧</a>
  <h1 id="title">読み込み中…</h1>
  <button class="btn" id="legendBtn">見かた</button>
</header>
<div class="purpose" id="purpose"></div>
<div id="trial3d" hidden style="padding:8px 14px;background:#eef5df;font-size:13px"><a href="pov-3d.html" style="color:#234d3e;font-weight:700">3D試作を見る → 体育館でユーゴを体験</a></div>
<script>if(new URLSearchParams(location.search).get('id')==='05')document.getElementById('trial3d').hidden=false;</script>
<div class="toolbar"><button class="btn-restart" id="restartBtn">⏮ 最初から</button><button class="btn-mirror" id="mirrorBtn">⇄ 左右反転</button><a class="btn-top" id="topLink" href="./">▦ 上から図</a></div>
<div class="app">
  <div class="pov-wrap">
    <div class="pov-stage">
      <canvas id="pov"></canvas>
      <div class="minimap"><svg id="court" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="callout" id="callout" hidden></div>
      <div class="stopbox" id="stopBox" hidden></div>
    </div>
  </div>
  <div class="panel">
    <div class="stepbar"><div class="dots" id="dots"></div><div class="mode" id="mode"></div></div>
    <h2 class="step-title" id="stepTitle"></h2>
    <p class="step-text" id="stepText"></p>
    <div class="branch-text" id="branchText" hidden></div>
    <div id="guideBox"></div>
    <ul class="notes" id="notes"></ul>
    <div class="branches" id="branches"></div>
  </div>
</div>
<div class="controls">
  <button id="prev" class="nav">◀ 前へ</button>
  <button id="replay" class="replay" title="もう一度">↻</button>
  <button id="auto" class="auto">▶ 自動再生</button>
  <button id="speed" class="speed">速さ 1x</button>
  <button id="next" class="nav primary">次へ ▶</button>
</div>
<script src="tactics/index.js?v=202609201201"></script>
<script src="js/glossary.js?v=202609201201"></script>
<script src="js/engine.js?v=202609201201"></script>
<script src="js/pov.js?v=202609201201"></script>
<script src="js/app.js?v=202609201201"></script>
</body>
</html>
