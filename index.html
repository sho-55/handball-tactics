<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハンド動き解説</title>
<link rel="stylesheet" href="css/style.css?v=202609200706">
</head>
<body>
<header class="top"><h1>ハンド動き解説（きっかけシート）</h1></header>
<div class="purpose">セットを選ぶと、駒が動いて流れを説明します。</div>
<div class="list" id="list"></div>
<script src="tactics/index.js?v=202609200706"></script>
<script>
  const list = document.getElementById("list");
  window.TACTIC_LIST.forEach((t) => {
    const a = document.createElement("a"); a.className = "card"; a.href = "tactic.html?id=" + t.id;
    a.innerHTML = `<div class="no">セット ${t.id}</div><h2>${t.title}</h2><p>${t.summary}</p>`;
    list.appendChild(a);
    if (t.trial3d) {
      const trial = document.createElement("a"); trial.className = "card trial3d"; trial.href = t.trial3d;
      trial.innerHTML = `<div class="no">セット ${t.id}　3Dテスト版</div><h2>${t.title.replace(/（.*$/, "")}を3Dで体験する</h2><p>右45度（RB）の目線で体育館へ。立体選手の動きを見ながら、パスや攻め方を確認できます。</p><span class="trial-link">3Dテストを開く →</span>`;
      list.appendChild(trial);
      if (["05", "06", "07"].includes(t.id)) {
        const reverse = document.createElement("a"); reverse.className = "card trial3d"; reverse.href = t.trial3d + (t.trial3d.includes("?") ? "&" : "?") + "mirror=1";
        reverse.innerHTML = `<div class="no">セット ${t.id}　3D・左右反転</div><h2>${t.title.replace(/（.*$/, "")}・左右逆をRB目線で体験する</h2><p>${t.id === "07" ? "RBがパスを受け、ブロックを使ってロング。守備を見てPV・LB・LWへの展開も選べます。" : t.id === "06" ? "RBからRWへ出して中央へ移動。ケンケンから守備を見て、ロング・PV・左への展開を選びます。" : "右45度（RB）からCBの後ろを回り込み、中央でパスを受けてPVと攻める動きを体験できます。"}</p><span class="trial-link">左右反転の3Dを開く →</span>`;
        list.appendChild(reverse);
      }
    }
    // 目線ページがあるセットは、その下に目線リンクを出す
    (t.povCards || []).forEach((c) => {
      const b = document.createElement("a"); b.className = "card pov"; b.href = `pov.html?id=${t.id}&pos=${c.pos}` + (c.mirror ? "&mirror=1" : "");
      b.innerHTML = `<div class="no">セット ${t.id}　目線ビュー</div><h2>${c.title}</h2><p>${c.summary}</p>`;
      list.appendChild(b);
    });
  });
  [["07", "センターサイド（7番）"], ["08", "CCダッポ（8番）"]].forEach(([no, name]) => {
    if (window.TACTIC_LIST.some((t) => t.id === no)) return;
    const d = document.createElement("div"); d.className = "card soon";
    d.innerHTML = `<div class="no">セット ${no}</div><h2>${name}</h2><p>準備中</p>`; list.appendChild(d);
  });
</script>
</body>
</html>
